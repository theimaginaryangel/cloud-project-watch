AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TagWatch Read-Only IAM Policy & User. Grants strictly read-only permissions
  to free AWS Describe*/List*/Tagging APIs so TagWatch can group costs by
  project and detect zombie resources without any ability to modify or delete
  your infrastructure.

Parameters:
  UserName:
    Type: String
    Default: tagwatch-readonly
    Description: IAM user name to create for TagWatch read-only scanning.
  AllowCostExplorerSync:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Optional: allow ce:GetCostAndUsage (TagWatch caps calls to 1x/24h = max $0.30/mo).

Conditions:
  EnableCostExplorer: !Equals [!Ref AllowCostExplorerSync, "true"]

Resources:
  TagWatchReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${UserName}-policy"
      Description: Strictly read-only Describe*/List* policy for TagWatch.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TagWatchFreeDiscovery
            Effect: Allow
            Action:
              - tag:GetResources
              - ec2:DescribeInstances
              - ec2:DescribeAddresses
              - ec2:DescribeVolumes
              - ec2:DescribeNatGateways
              - ec2:DescribeRegions
              - rds:DescribeDBInstances
              - secretsmanager:ListSecrets
              - elasticloadbalancing:DescribeLoadBalancers
              - sts:GetCallerIdentity
            Resource: "*"
          - !If
            - EnableCostExplorer
            - Sid: TagWatchOptionalDailyCostExplorer
              Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: "*"
            - !Ref AWS::NoValue

  TagWatchUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      ManagedPolicyArns:
        - !Ref TagWatchReadOnlyPolicy

Outputs:
  IAMUserName:
    Description: Created strictly read-only IAM user. Generate an Access Key in IAM Console -> Security Credentials.
    Value: !Ref TagWatchUser
  ManagedPolicyArn:
    Description: ARN of the strictly read-only TagWatch policy.
    Value: !Ref TagWatchReadOnlyPolicy

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudprojectwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpw
      POSTGRES_PASSWORD: cpw
      POSTGRES_DB: cloudprojectwatch
    ports:
      - "5432:5432"
    volumes:
      - cpw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpw -d cloudprojectwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cpw_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudprojectwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpw}
      POSTGRES_DB: ${POSTGRES_DB:-cloudprojectwatch}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cpw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cpw} -d $${POSTGRES_DB:-cloudprojectwatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cpw_pgdata:

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudProjectWatch Read-Only IAM Policy & User. Grants read-only access to
  free AWS Describe/List/Tagging APIs so CloudProjectWatch can group costs by
  project without any permission to modify or delete resources.

Parameters:
  UserName:
    Type: String
    Default: cloudprojectwatch-readonly
    Description: IAM user name to create for CloudProjectWatch read-only scanning.
  AllowCostExplorerSync:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Optional: allow ce:GetCostAndUsage (locked to 1 call per 24h, max $0.30/month).

Conditions:
  EnableCostExplorer: !Equals [!Ref AllowCostExplorerSync, "true"]

Resources:
  CloudProjectWatchReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${UserName}-policy"
      Description: Read-only Describe/List policy for CloudProjectWatch.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudProjectWatchFreeDiscovery
            Effect: Allow
            Action:
              - tag:GetResources
              - ec2:DescribeInstances
              - ec2:DescribeAddresses
              - ec2:DescribeVolumes
              - ec2:DescribeNatGateways
              - ec2:DescribeRegions
              - rds:DescribeDBInstances
              - secretsmanager:ListSecrets
              - elasticloadbalancing:DescribeLoadBalancers
              - sts:GetCallerIdentity
            Resource: "*"
          - !If
            - EnableCostExplorer
            - Sid: CloudProjectWatchDailyCostExplorer
              Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: "*"
            - !Ref AWS::NoValue

  CloudProjectWatchUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      ManagedPolicyArns:
        - !Ref CloudProjectWatchReadOnlyPolicy

Outputs:
  IAMUserName:
    Description: Read-only IAM user. Create an Access Key in IAM Console -> Security Credentials.
    Value: !Ref CloudProjectWatchUser
  ManagedPolicyArn:
    Description: ARN of the read-only CloudProjectWatch policy.
    Value: !Ref CloudProjectWatchReadOnlyPolicy
